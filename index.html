<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Royal Reception Invitation | #ShaMa</title>
  <style>
    :root {
      --magenta: #3d031c;
      --deep-magenta: #1d010d;
      --gold: #D4AF37;
      --light-gold: #f9e8a2;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Georgia', serif;
    }

    body {
      background: radial-gradient(circle, var(--magenta), var(--deep-magenta));
      color: var(--light-gold);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Floating Music Control */
    .music-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 45px;
      height: 45px;
      background: linear-gradient(45deg, #BF953F, #FCF6BA, #B38728);
      border: 2px solid var(--magenta);
      border-radius: 50%;
      color: var(--deep-magenta);
      font-size: 1.2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    /* Envelope Styling */
    .envelope-wrapper {
      position: relative;
      width: 320px;
      height: 220px;
      background: var(--magenta);
      border: 3px solid var(--gold);
      border-radius: 10px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.8s ease-in-out;
      z-index: 10;
    }

    .wax-seal {
      width: 85px;
      height: 85px;
      background: radial-gradient(circle, #e6c667, #8a640f);
      border: 3px solid #fff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--deep-magenta);
      font-weight: bold;
      font-size: 1rem;
      box-shadow: 0 5px 15px rgba(0,0,0,0.6);
      text-align: center;
    }

    /* Card Styling */
    .card-container {
      display: none;
      width: 100%;
      max-width: 480px;
      background: var(--deep-magenta);
      border: 3px solid var(--gold);
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 15px var(--gold);
      text-align: center;
      animation: fadeIn 1.2s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    h1 {
      color: var(--gold);
      font-size: 1.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .sub-title {
      font-size: 0.9rem;
      color: var(--light-gold);
      font-style: italic;
      margin-bottom: 20px;
    }

    /* Scratch Card Section */
    .scratch-container {
      position: relative;
      width: 280px;
      height: 120px;
      margin: 20px auto;
      border: 2px solid var(--gold);
      border-radius: 10px;
      overflow: hidden;
    }

    .scratch-content {
      position: absolute;
      width: 100%;
      height: 100%;
      background: var(--magenta);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: var(--gold);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      cursor: pointer;
    }

    /* Countdown Timer */
    .timer {
      display: flex;
      justify-content: space-around;
      margin: 15px 0;
      background: rgba(61, 3, 28, 0.7);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--gold);
    }

    .time-num {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--white);
    }

    .time-label {
      font-size: 0.7rem;
      color: var(--gold);
    }

    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 20px;
      background: linear-gradient(45deg, #BF953F, #FCF6BA, #B38728);
      color: var(--deep-magenta);
      font-weight: bold;
      text-decoration: none;
      border-radius: 25px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <!-- Floating Audio Button -->
  <button class="music-btn" id="musicToggle" onclick="toggleAudio()">🎵</button>

  <!-- Seelay Seelay Audio File -->
  <audio id="bgMusic" loop>
    <source src="Seelay-Seelay.mp3" type="audio/mpeg">
  </audio>

  <!-- Envelope Screen -->
  <div class="envelope-wrapper" id="envelope" onclick="openEnvelope()">
    <div class="wax-seal">
      <span>#ShaMa<br><small style="font-size: 0.6rem;">OPEN</small></span>
    </div>
  </div>

  <!-- Main Card Screen -->
  <div class="card-container" id="mainCard">
    <h1>Grand Reception</h1>
    <p class="sub-title">You are cordially invited!</p>

    <div style="margin: 15px 0; line-height: 1.6; font-size: 0.95rem;">
      <p><b>Date:</b> September 16, 2026</p>
      <p><b>Time:</b> 11:00 AM Onwards</p>
      <p><b>Venue:</b> Sneha Mahal, Vedasandur</p>
    </div>

    <!-- Scratch Section -->
    <div class="scratch-container">
      <div class="scratch-content">
        <h2 style="font-size: 1.2rem; color: #FFF;">Sheshathri & Janani</h2>
        <p style="font-size: 0.8rem; margin-top: 5px;">#ShaMa Reception</p>
      </div>
      <canvas id="scratchCanvas" width="280" height="120"></canvas>
    </div>
    <p style="font-size: 0.75rem; color: #D4AF37;">✨ Scratch above to reveal our names ✨</p>

    <!-- Countdown Timer -->
    <div style="margin-top: 20px; font-size: 0.9rem; color: var(--gold);">Countdown to Celebration</div>
    <div class="timer">
      <div><span id="days" class="time-num">00</span><br><span class="time-label">Days</span></div>
      <div><span id="hours" class="time-num">00</span><br><span class="time-label">Hours</span></div>
      <div><span id="mins" class="time-num">00</span><br><span class="time-label">Mins</span></div>
      <div><span id="secs" class="time-num">00</span><br><span class="time-label">Secs</span></div>
    </div>

    <!-- Map Button -->
    <a href="https://www.google.com/maps?gs_lcrp=EgZjaHJvbWUqEAgBEC4YrwEYxwEYgAQYjgUyCggAEAAY4wIYgAQyEAgBEC4YrwEYxwEYgAQYjgUyBggCEEUYOTIHCAMQABiABDIICAQQABgWGB7SAQg4NTYwajBqN6gCCLACAfEFoqtOvsbZ6Bc&um=1&ie=UTF-8&fb=1&gl=in&sa=X&geocode=KZG7IKD0Aqo7MSGICLh-5j2M&daddr=Kalanjipatty,+Vedasandur,+Tamil+Nadu+624710" target="_blank" class="btn">📍 Location / Map</a>
  </div>

  <script>
    const audio = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicToggle');

    function openEnvelope() {
      document.getElementById('envelope').style.display = 'none';
      document.getElementById('mainCard').style.display = 'block';
      
      // Auto-play Seelay Seelay music when envelope is opened
      audio.play().then(() => {
        musicBtn.innerText = '🔊';
      }).catch(err => {
        console.log("Autoplay blocked by browser");
      });
      
      initScratch();
    }

    function toggleAudio() {
      if (audio.paused) {
        audio.play();
        musicBtn.innerText = '🔊';
      } else {
        audio.pause();
        musicBtn.innerText = '🔇';
      }
    }

    // Scratch Card
    function initScratch() {
      const canvas = document.getElementById('scratchCanvas');
      const ctx = canvas.getContext('2d');
      let isDrawing = false;

      const grad = ctx.createLinearGradient(0, 0, 280, 120);
      grad.addColorStop(0, '#D4AF37');
      grad.addColorStop(0.5, '#FFF8DC');
      grad.addColorStop(1, '#AA771C');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#2A0518';
      ctx.font = '14px Georgia';
      ctx.textAlign = 'center';
      ctx.fillText('SCRATCH HERE', 140, 65);

      function scratch(e) {
        if (!isDrawing) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
        const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
        
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(x, y, 15, 0, Math.PI * 2);
        ctx.fill();
      }

      canvas.addEventListener('mousedown', () => isDrawing = true);
      canvas.addEventListener('mouseup', () => isDrawing = false);
      canvas.addEventListener('mousemove', scratch);
      canvas.addEventListener('touchstart', () => isDrawing = true);
      canvas.addEventListener('touchend', () => isDrawing = false);
      canvas.addEventListener('touchmove', scratch);
    }

    // Countdown to Sept 16, 2026
    const targetDate = new Date('September 16, 2026 11:00:00').getTime();
    function updateCountdown() {
      const now = new Date().getTime();
      const diff = targetDate - now;

      if (diff > 0) {
        document.getElementById('days').innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
        document.getElementById('hours').innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        document.getElementById('mins').innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        document.getElementById('secs').innerText = Math.floor((diff % (1000 * 60)) / 1000);
      }
    }
    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
